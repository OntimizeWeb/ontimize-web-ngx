<span mat-dialog-title>{{ 'TABLE.BUTTONS.FILTER_LOAD' | oTranslate }}</span>
<mat-dialog-content class="o-flex-column">
  <div mat-subheader>{{ 'TABLE.DIALOG.LOAD_FILTER' | oTranslate }}</div>
  <mat-selection-list #filterList class="o-table-load-filter-dialog-list">
    @for (filter of filters ; track filter) {
      <mat-list-option [value]="filter.name" checkboxPosition="before">
        <span matListItemTitle class="o-table-load-filter-dialog-list-title">{{ filter.name }}</span>
        <span matListItemLine>{{ filter.description }}</span>
      </mat-list-option>
    }
    @if (filters.length === 0) {
      <mat-list-item>
        <span class="empty-filter-list">{{ 'TABLE.DIALOG.EMPTY_FILTER_LIST' | oTranslate }}</span>
      </mat-list-item>
    }
  </mat-selection-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button [disabled]="filterList.selectedOptions.selected.length!==1"
  (click)="removeFilter(filterList.selectedOptions.selected[0].value)" data-testid="dialog-delete" class="o-button--importance-default">{{ 'DELETE' | oTranslate }}</button>
  <span class="o-flex"></span>
  <button type="button" mat-stroked-button [mat-dialog-close]="false" data-testid="dialog-cancel" class="o-button--importance-default">{{ 'CANCEL' | oTranslate }}</button>
  <button type="button" mat-stroked-button [mat-dialog-close]="true" [disabled]="filterList.selectedOptions.selected.length!==1"
    data-testid="dialog-accept" class="o-button--importance-primary">
    {{'TABLE.BUTTONS.APPLY' | oTranslate }}
  </button>
</mat-dialog-actions>
