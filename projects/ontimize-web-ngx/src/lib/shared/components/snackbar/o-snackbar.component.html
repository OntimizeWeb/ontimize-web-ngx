<div class="o-flex-row o-layout-align-start-center">
  @if (icon && iconPosition==='left') {
    <mat-icon class="o-snackbar-icon">{{ icon }}</mat-icon>
  }
  <span class="o-flex o-snackbar-message">
    {{ message | oTranslate }}
  </span>
  @if (icon && iconPosition==='right') {
    <mat-icon class="o-snackbar-icon">{{ icon }}</mat-icon>
  }
  @if (action) {
    <button type="button" (click)="onAction()"
    class="mat-simple-snackbar-action">{{ action | oTranslate }}</button>
  }
</div>
