<mat-select [value]="getSelectValue()" (selectionChange)="onSelectionChange($event,item)" required>
  <mat-select-trigger>
    {{item | oTranslate}} ({{getViewValue() | oTranslate}})
  </mat-select-trigger>
  @for (type of dateTypes; track type) {
    <mat-option [value]="type.value">
      {{type.viewValue | oTranslate}}
    </mat-option>
  }
</mat-select>
