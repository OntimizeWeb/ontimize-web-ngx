<mat-card class="o-flex-column o-layout-align-center-center">
  <mat-card-title-group>
    @if (showImage) {
      <img src="{{ image }}" [class.mat-mdc-card-sm-image]="compareListHeight('small')"
        [class.mat-mdc-card-md-image]="compareListHeight('medium')" [class.mat-mdc-card-lg-image]="compareListHeight('large')" alt="card title image">
    }
    @if (title !== undefined) {
      <mat-card-title> {{ title }}</mat-card-title>
    }
    @if (subtitle !== undefined) {
      <mat-card-subtitle> {{ subtitle }}</mat-card-subtitle>
    }
  </mat-card-title-group>
  <mat-card-actions>
    @if (action1Text !== undefined) {
      <button type="button" mat-button (click)="onAction1ButtonClick($event)">{{ action1Text }}</button>
    }
    @if (action2Text !== undefined) {
      <button type="button" mat-button (click)="onAction2ButtonClick($event)">{{ action2Text }}</button>
    }
  </mat-card-actions>
</mat-card>
