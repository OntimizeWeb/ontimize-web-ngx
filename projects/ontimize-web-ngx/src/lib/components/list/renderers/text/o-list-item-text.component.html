<div fxLayout="row" fxLayoutAlign="start center">
  @if (icon !== undefined && iconPosition === ICON_POSITION_LEFT) {
    <mat-icon class="material-icons o-list-item-icon"
      (click)="onActionIconClick($event)">
      {{ icon }}
    </mat-icon>
  }
  <div class="mat-mdc-list-item">
    <span matListItemTitle class="primary-text"> {{ title }} </span>
    @if (primaryText !== undefined) {
      <span matListItemLine class="primary-text">{{ primaryText }}</span>
    }
    @if (secondaryText !== undefined) {
      <span matListItemLine class="secondary-text">{{ secondaryText }}</span>
    }
  </div>
  @if (icon !== undefined && iconPosition === ICON_POSITION_RIGHT) {
    <mat-icon class="material-icons o-list-item-icon"
      (click)="onActionIconClick($event)">
      {{icon }}
    </mat-icon>
  }
</div>
