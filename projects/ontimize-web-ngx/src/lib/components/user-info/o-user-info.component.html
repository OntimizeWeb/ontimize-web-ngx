<div class="o-user-info-container" fxLayout="row" fxLayoutAlign="center">
  @if (existsUserInfo) {
    <div class="o-user-info-wrapper" fxLayout="row" fxLayoutAlign="center center" [matMenuTriggerFor]="menu"
      fxLayoutGap="16px">
      <div fxLayout="row" fxLayoutAlign="center center" class="o-user-info-avatar-wrapper">
        @if (avatar) {
          <img [src]="avatar" alt="avatar image"/>
        }
      </div>
      @if (username) {
        <span class="o-user-info-username"> {{ username }}</span>
      }
      <mat-icon id="arrow-icon" svgIcon="ontimize:keyboard_arrow_down"></mat-icon>
    </div>
    <mat-menu #menu="matMenu" yPosition="below" class="o-mat-menu">
      @if (showProfile) {
        <button type="button" mat-menu-item (click)="onProfileClick()">
          <mat-icon>person</mat-icon>
          <span>{{ 'APP_LAYOUT.USER_PROFILE' | oTranslate }}</span>
        </button>
      }
      @if (showSettings) {
        <button id="menu-settings" type="button" mat-menu-item (click)="onSettingsClick()">
          <mat-icon svgIcon="ontimize:settings"></mat-icon>
          <span>{{ 'APP_LAYOUT.SETTINGS' | oTranslate }}</span>
        </button>
      }
      @if (userInfoConfiguration) {
        @for (item of userInfoConfiguration.userInfoConfigurationItems; track item) {
          <button type="button" mat-menu-item
            [matTooltip]="$any(item).name | oTranslate" matTooltipDisabled="item.tooltip" [ngClass]="$any(item).class"
            (click)="item.triggerOnClick($event)">
            <mat-icon>{{$any(item).icon}} </mat-icon>
            <span>{{ $any(item).name | oTranslate }}</span>
          </button>
        }
      }
      @if (showLogout) {
        <button id="menu-logout" type="button" mat-menu-item (click)="onLogoutClick()">
          <mat-icon svgIcon="ontimize:power_settings_new"></mat-icon>
          <span>{{ 'LOGOUT' | oTranslate }}</span>
        </button>
      }
    </mat-menu>
  }
</div>
