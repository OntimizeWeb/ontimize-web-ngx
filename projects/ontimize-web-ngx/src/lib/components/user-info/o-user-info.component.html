<div class="o-user-info-container o-flex-row o-layout-align-center">
  @if (existsUserInfo) {
    <div class="o-user-info-wrapper o-flex-row o-layout-align-center-center o-gap-16" [matMenuTriggerFor]="menu" data-testid="user-info-trigger">
      <div class="o-user-info-avatar-wrapper o-flex-row o-layout-align-center-center">
        @if (avatar) {
          <img [src]="avatar" alt="avatar image"/>
        }
      </div>
      @if (username) {
        <span class="o-user-info-username"> {{ username }}</span>
      }
      <mat-icon id="arrow-icon">keyboard_arrow_down</mat-icon>
    </div>
    <mat-menu #menu="matMenu" yPosition="below" class="o-mat-menu">
      @if (showProfile) {
        <button type="button" mat-menu-item (click)="onProfileClick()">
          <mat-icon>person</mat-icon>
          <span>{{ 'APP_LAYOUT.USER_PROFILE' | oTranslate }}</span>
        </button>
      }
      @if (showSettings) {
        <button id="menu-settings" data-testid="menu-settings" type="button" mat-menu-item (click)="onSettingsClick()">
          <mat-icon>settings</mat-icon>
          <span>{{ 'APP_LAYOUT.SETTINGS' | oTranslate }}</span>
        </button>
      }
      @if (userInfoConfiguration) {
        @for (item of userInfoConfiguration.userInfoConfigurationItems; track item) {
          <button type="button" mat-menu-item
            [matTooltip]="$any(item).name | oTranslate" matTooltipDisabled="item.tooltip" [ngClass]="$any(item).class"
            (click)="item.triggerOnClick($event)">
            <mat-icon>{{$any(item).icon}} </mat-icon>
            <span>{{ $any(item).name | oTranslate }}</span>
          </button>
        }
      }
      @if (showLogout) {
        <button id="menu-logout" data-testid="menu-logout" type="button" mat-menu-item (click)="onLogoutClick()">
          <mat-icon>power_settings_new</mat-icon>
          <span>{{ 'LOGOUT' | oTranslate }}</span>
        </button>
      }
    </mat-menu>
  }
</div>
