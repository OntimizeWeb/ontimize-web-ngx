<div class="o-flex-row o-layout-align-center-center o-flex-fill">
  @if (useFlagIcons) {
    <button type="button" class="menu-button" mat-icon-button [matMenuTriggerFor]="langMenu">
      <span class="flag-icon {{ getFlagClass(getCurrentCountry()) }}"></span>
    </button>
  }

  @if (!useFlagIcons) {
    <button type="button" class="menu-button o-language-selector-text" mat-button [matMenuTriggerFor]="langMenu">
      <span>{{ 'LOCALE_' + getCurrentLang() | oTranslate }}</span>
    </button>
  }
</div>

<mat-menu #langMenu="matMenu" yPosition="below" class="o-mat-menu">
  @for (lang of getAvailableLangs(); track lang) {
    <button type="button" mat-menu-item (click)="configureI18n(lang)">
      @if (useFlagIcons) {
        <span class="flag-icon {{ getFlagClass(lang) }}"></span>
      }
      <span>{{ 'LOCALE_' + lang | oTranslate }}</span>
    </button>
  }
</mat-menu>
