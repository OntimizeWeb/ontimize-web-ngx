<div class="fake-li mat-primary " [class.fake-li-hover]="isHovered" [class.is-selected]="isConfiguredLang()">
  <a class="mat-list-item o-flex-row o-layout-align-sb-center" [attr.data-testid]="dataTestId" (click)="configureI18n()">
    @if (icon !== undefined) {
      <mat-icon class="o-bar-menu-item-icon mat-24">{{ icon }}</mat-icon>
    }
    <div class="o-bar-menu-item-title o-flex" matLine>{{ title | oTranslate }}</div>
    @if (isConfiguredLang()) {
      <mat-icon class="o-bar-menu-item-icon configured-lang mat-24">check_circle</mat-icon>
    }
  </a>
</div>
