@if (!restricted) {
  <div class="fake-li mat-primary" (click)="collapseMenu($event)" [attr.data-testid]="dataTestId" [class.fake-li-hover]="isHovered">
    @if (action || route) {
      <a class="mat-list-item" (click)="onClick()">
        <mat-icon class="o-bar-menu-item-icon mat-24">{{ icon }}</mat-icon>
        <div class="o-bar-menu-item-title">{{ title | oTranslate }}</div>
      </a>
    }
    @if (!route && !action) {
      <div class="o-bar-menu-item-text mat-list-item">
        <mat-icon class="o-bar-menu-item-icon mat-24">{{ icon }}</mat-icon>
        <div class="o-bar-menu-item-title">{{ title | oTranslate }}</div>
      </div>
    }
  </div>
}
