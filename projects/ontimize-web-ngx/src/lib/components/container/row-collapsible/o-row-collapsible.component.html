<mat-expansion-panel #expPanel [expanded]="expanded" class="o-container" (opened)="updateInnerHeight(null)" (closed)="updateInnerHeight(0)">
  <mat-expansion-panel-header #containerTitle [expandedHeight]="expandedHeight" [collapsedHeight]="collapsedHeight">
    <mat-panel-title class="o-container-title o-flex-row o-layout-align-start-center">
      @if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
      }
      @if (title) {
        <span>{{ title | oTranslate }}</span>
      }
    </mat-panel-title>
    <mat-panel-description class="o-flex-row o-layout-align-start-center">
      <span>{{ description | oTranslate }}</span>
    </mat-panel-description>
  </mat-expansion-panel-header>
  <div #containerContent id="innerRow" [ngStyle]="layoutAlignStyles" [style.gap]="layoutGap"
    class="o-container-scroll o-scroll o-flex-row o-flex-grow">
    <ng-content></ng-content>
  </div>
</mat-expansion-panel>
@if (isAppearanceOutline()) {
  <div #oContainerOutline [class.o-container-outline-expanded]="expPanel.expanded" class="o-container-outline">
    <div class="o-container-outline-start"></div>
    <div class="o-container-outline-gap-title"></div>
    <div class="o-container-outline-gap-empty1"></div>
    <div class="o-container-outline-gap-description"></div>
    <div class="o-container-outline-gap-empty2"></div>
    <div class="o-container-outline-gap-icon"></div>
    <div class="o-container-outline-end"></div>
  </div>
}
