<div #container fxLayout="column" class="o-container" fxFill>
  @if (hasHeaderOrAppearanceOutlineSetted()) {
    <div #containerTitle fxLayoutAlign="start center" class="o-container-title" layout-padding>
      @if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
      }
      @if (title) {
        <span>{{ title | oTranslate }}</span>
      }
    </div>
  }
  <div [class.o-container-gap]="hasHeaderOrAppearanceOutlineSetted() || (elevation > 0 && elevation <= 12)" class="o-container-scroll o-scroll">
    @if (hasHeaderAndAppearanceOutline() || isAppearanceOutlineSetted()) {
      <div class="o-container-outline">
        <div class="o-container-outline-start"></div>
        <div class="o-container-outline-gap"></div>
        <div class="o-container-outline-end"></div>
      </div>
    }
    <div fxLayout="row" fxLayoutAlign="{{ layoutAlign }}" fxLayoutGap="{{ layoutGap }}" fxFlex="grow">
      <ng-content></ng-content>
    </div>
  </div>
</div>
