<div [class.custom-width]="hasCustomWidth" [formGroup]="getFormGroup()" class="relative" [matTooltip]="tooltip"
  [matTooltipClass]="tooltipClass" [matTooltipPosition]="tooltipPosition" [matTooltipShowDelay]="tooltipShowDelay"
  [matTooltipHideDelay]="tooltipHideDelay" class="o-flex-row o-layout-align-start-center o-flex-fill">
  <mat-checkbox [id]="getAttribute()" [attr.data-testid]="dataTestId" [formControlName]="getAttribute()" (change)="onChangeEvent($event)"
    [labelPosition]="labelPosition" [color]="color">
    {{ olabel | oTranslate }}
    <mat-error *oMatError="hasError('required')">
      {{ 'FORM_VALIDATION.REQUIRED' | oTranslate }}
    </mat-error>
    @for (oError of getActiveOErrors(); track oError) {
      <mat-error>
        {{ oError.text | oTranslate }}
      </mat-error>
    }
  </mat-checkbox>
  @if (isReadOnly) {
    <div (click)="onClickBlocker($event)" class="read-only-blocker o-flex-fill"></div>
  }
</div>
