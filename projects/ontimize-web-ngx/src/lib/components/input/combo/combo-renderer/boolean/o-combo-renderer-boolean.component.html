<ng-template #templateref let-value="value">
  @if (hasComboTrueValue(value)) {
    @switch (renderType) {
      @case ('number') {
        {{ renderTrueValue }}
      }
      @default {
        <span>{{ renderTrueValue | oTranslate }}</span>
      }
    }
  } @else {
    @switch (renderType) {
      @case ('number') {
        {{ renderFalseValue }}
      }
      @default {
        {{ renderFalseValue | oTranslate}}
      }
    }
  }
</ng-template>
