<div [formGroup]="getFormGroup()" class="relative" [matTooltip]="tooltip" [matTooltipClass]="tooltipClass" [matTooltipPosition]="tooltipPosition"
  [matTooltipShowDelay]="tooltipShowDelay" [matTooltipHideDelay]="tooltipHideDelay">
  @switch (true) {
    @case (thumbLabel && !showTickMarks) {
      <mat-slider discrete [color]="color" [max]="max" [min]="min" [step]="step"
        [displayWith]="oDisplayWith">
        <input matSliderThumb (change)="onChangeEvent($event)" [id]="getAttribute()" [formControlName]="getAttribute()" />
      </mat-slider>
    }
    @case (!thumbLabel && !showTickMarks) {
      <mat-slider [color]="color" [max]="max" [min]="min" [step]="step" [displayWith]="oDisplayWith">
        <input matSliderThumb (change)="onChangeEvent($event)"  [id]="getAttribute()" [formControlName]="getAttribute()" />
      </mat-slider>
    }
    @case (thumbLabel && showTickMarks) {
      <mat-slider [color]="color" [max]="max" [min]="min" [step]="step" discrete
        [displayWith]="oDisplayWith" showTickMarks>
        <input matSliderThumb (change)="onChangeEvent($event)" [id]="getAttribute()" [formControlName]="getAttribute()" />
      </mat-slider>
    }
    @case (!thumbLabel && showTickMarks) {
      <mat-slider [color]="color" [max]="max" [min]="min" [step]="step" [displayWith]="oDisplayWith"
        showTickMarks>
        <input matSliderThumb (change)="onChangeEvent($event)" [id]="getAttribute()" [formControlName]="getAttribute()" />
      </mat-slider>
    }
  }
  @if (isReadOnly) {
    <div (click)="onClickBlocker($event)" class="read-only-blocker" fxFill></div>
  }

</div>
