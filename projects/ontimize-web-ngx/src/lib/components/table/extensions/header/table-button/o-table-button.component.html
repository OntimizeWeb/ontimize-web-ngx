@if (table.showButtonsText) {
  @switch (variant) {
    @case ('flat') {
      <!-- filled variant: importance routes to the container colour, label stays legible -->
      <button type="button" [disabled]="!enabled" [class.disabled]="!enabled" [color]="color" mat-flat-button (click)="innerOnClick($event)">
        @if (isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
        <span>{{ effectiveLabel | oTranslate }}</span>
        @if (!isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (!isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
      </button>
    }
    @case ('basic') {
      <button type="button" [disabled]="!enabled" [class.disabled]="!enabled" [ngClass]="importanceClass" mat-button (click)="innerOnClick($event)">
        @if (isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
        <span>{{ effectiveLabel | oTranslate }}</span>
        @if (!isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (!isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
      </button>
    }
    @case ('raised') {
      <!-- elevated variant: light container, so importance colours the label -->
      <button type="button" [disabled]="!enabled" [class.disabled]="!enabled" [ngClass]="importanceClass" mat-raised-button (click)="innerOnClick($event)">
        @if (isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
        <span>{{ effectiveLabel | oTranslate }}</span>
        @if (!isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (!isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
      </button>
    }
    @default {
      <button type="button" [disabled]="!enabled" [class.disabled]="!enabled" [ngClass]="importanceClass" mat-stroked-button (click)="innerOnClick($event)">
        @if (isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
        <span>{{ effectiveLabel | oTranslate }}</span>
        @if (!isIconPositionLeft() && svgIcon !== undefined) {
          <mat-icon [svgIcon]="svgIcon"></mat-icon>
        }
        @if (!isIconPositionLeft() && svgIcon === undefined) {
          <mat-icon>{{ icon }}</mat-icon>
        }
      </button>
    }
  }
}

@if (!table.showButtonsText) {
  <button type="button" [disabled]="!enabled" [class.disabled]="!enabled" [ngClass]="importanceClass" mat-icon-button (click)="innerOnClick($event)">
    @if (isIconPositionLeft() && svgIcon !== undefined) {
      <mat-icon [svgIcon]="svgIcon"></mat-icon>
    }
    @if (isIconPositionLeft() && svgIcon === undefined) {
      <mat-icon>{{ icon }}</mat-icon>
    }
    @if (!isIconPositionLeft() && svgIcon !== undefined) {
      <mat-icon [svgIcon]="svgIcon"></mat-icon>
    }
    @if (!isIconPositionLeft() && svgIcon === undefined) {
      <mat-icon>{{ icon }}</mat-icon>
    }
  </button>
}
