<span mat-dialog-title>{{ 'TABLE.BUTTONS.COLVIS' | oTranslate }}</span>


<mat-dialog-content>
  <div mat-subheader>{{'TABLE.VISIBLE_COLUMNS.DESCRIPTION' | oTranslate}}</div>

  <div [ngClass]="rowHeight">
    <mat-list cdkDropList (cdkDropListDropped)="drop($event)">
      @for (column of columns; track column) {
        <mat-list-item cdkDrag (click)="onClickColumn(column)" [ngClass]="{'column-hidden':!column.visible}"
          class="o-drag-list-item-box">
          <div class="o-flex-row o-flex o-layout-align-stretch-center">
            <mat-icon matListItemIcon>drag_handle</mat-icon>
            <span matListItemLine class="o-flex">{{ (column.title || column.attr) | oTranslate }}</span>
            @if (column.visible) {
              <mat-icon color="primary">visibility</mat-icon>
            }
            @if (!column.visible) {
              <mat-icon>visibility_off</mat-icon>
            }
          </div>
          <mat-divider></mat-divider>
        </mat-list-item>
      }
    </mat-list>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="o-layout-align-end-center">
  <button type="button" mat-stroked-button [mat-dialog-close]="null" class="o-button--importance-default" cancel>{{ 'CANCEL' | oTranslate }}</button>
  <button type="button" mat-stroked-button (click)="closeDialog()" class="o-button--importance-primary">{{ 'ACCEPT' | oTranslate }}</button>
</mat-dialog-actions>
