<ng-template #templateref let-cellvalue="cellvalue" let-rowvalue="rowvalue">
  <span class="o-action-cell-renderer" (click)="innerOnClick($event, rowvalue)">
    @if (isIconPositionLeft()) {
      <mat-icon>{{ icon }}</mat-icon>
    }
    @if (isSvgIconPositionLeft()) {
      <mat-icon [svgIcon]="svgIcon"></mat-icon>
    }
    @if (text !== undefined) {
      <span>{{ text | oTranslate }}</span>
    }
    @if (isIconPositionRight()) {
      <mat-icon>{{ icon }}</mat-icon>
    }
    @if (isSvgIconPositionRight()) {
      <mat-icon [svgIcon]="svgIcon"></mat-icon>
    }
  </span>
</ng-template>
