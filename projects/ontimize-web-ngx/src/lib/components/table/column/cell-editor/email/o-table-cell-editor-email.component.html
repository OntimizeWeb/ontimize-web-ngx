<ng-template #templateref let-cellvalue="cellvalue" let-rowvalue="rowvalue">
  <div class="o-table-cell-editor-email o-table-cell-editor" [formGroup]="formGroup"
    [matTooltip]="tooltip"
    [matTooltipClass]="tooltipClass"
    [matTooltipPosition]="tooltipPosition"
    [matTooltipShowDelay]="tooltipShowDelay"
    [matTooltipHideDelay]="tooltipHideDelay">
    <mat-form-field cdkFocusInitial>
      <input #input matInput type="email" [email]="true" [placeholder]="getPlaceholder()" [formControl]="formControl" [id]="cellEditorId" [attr.data-testid]="dataTestId"
        [required]="orequired">
        <mat-error *oMatError="hasError('required')">
          {{ 'FORM_VALIDATION.REQUIRED' | oTranslate }}
        </mat-error>
        <mat-error *oMatError="hasError('email')">
          {{ 'FORM_VALIDATION.EMAIL_FORMAT' | oTranslate }}
        </mat-error>
        @for (oError of getActiveOErrors(); track oError) {
          <mat-error>
            {{ getErrorText(oError) }}
          </mat-error>
        }
      </mat-form-field>
    </div>
  </ng-template>
