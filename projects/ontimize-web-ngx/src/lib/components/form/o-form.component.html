<ng-template #customFormToolbarButtons>
  <ng-content select="[o-form-toolbar-buttons]"></ng-content>
</ng-template>

@if (showFloatingToolbar && headerPosition==='top') {
  <o-form-toolbar [label-header]="labelheader" [label-header-align]="labelHeaderAlign"
    [header-actions]="headeractions" [show-header-navigation]="showHeaderNavigation" [show-header-actions-text]="showHeaderActionsText"
    (onCancel)="onCancel.emit($event)" layout-padding>
    <div o-custom-form-toolbar-buttons-wrapper class="o-flex-row o-layout-align-end-center">
      <ng-container *ngTemplateOutlet="customFormToolbarButtons"></ng-container>
    </div>
  </o-form-toolbar>
}

<ng-host oKeyboardListener keyboardKeys="17;90" (onKeysPressed)="undoKeyboardPressed()" class="scrolling o-scroll">
  <div class="o-flex-grow">
    @if (showNotFloatingToolbar && headerPosition==='top') {
      <o-form-toolbar [label-header]="labelheader" [label-header-align]="labelHeaderAlign"
        [header-actions]="headeractions" [show-header-navigation]="showHeaderNavigation" [show-header-actions-text]="showHeaderActionsText"
        (onCancel)="onCancel.emit($event)" layout-padding>
        <div o-custom-form-toolbar-buttons-wrapper class="o-flex-row o-layout-align-end-center">
          <div o-custom-form-toolbar-buttons-wrapper class="o-flex-row o-layout-align-end-center">
            <ng-container *ngTemplateOutlet="customFormToolbarButtons"></ng-container>
          </div>
        </div>
      </o-form-toolbar>
    }

    <form #innerForm [formGroup]="formGroup" class="inner-form" [class.form-no-toolbar]="!showHeader" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false">
      @if (loading | async) {
        <div class="progress-bar-container">
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </div>
      }
      <div layout-padding [ngClass]="layoutClasses" class="o-form-content-wrapper">
        <ng-content></ng-content>
      </div>
    </form>

    @if (showNotFloatingToolbar && headerPosition==='bottom') {
      <o-form-toolbar [label-header]="labelheader" [label-header-align]="labelHeaderAlign"
        [header-actions]="headeractions" [show-header-navigation]="showHeaderNavigation" [show-header-actions-text]="showHeaderActionsText"
        (onCancel)="onCancel.emit($event)" layout-padding>
        <div o-custom-form-toolbar-buttons-wrapper class="o-flex-row o-layout-align-end-center">
          <ng-container *ngTemplateOutlet="customFormToolbarButtons"></ng-container>
        </div>
      </o-form-toolbar>
    }
  </div>
</ng-host>

@if (showFloatingToolbar && headerPosition==='bottom') {
  <o-form-toolbar [label-header]="labelheader" [label-header-align]="labelHeaderAlign"
    [header-actions]="headeractions" [show-header-navigation]="showHeaderNavigation" [show-header-actions-text]="showHeaderActionsText"
    (onCancel)="onCancel.emit($event)" layout-padding>
    <div o-custom-form-toolbar-buttons-wrapper class="o-flex-row o-layout-align-end-center">
      <ng-container *ngTemplateOutlet="customFormToolbarButtons"></ng-container>
    </div>
  </o-form-toolbar>
}
