<mat-button-toggle #bt [id]="oattr" [attr.data-testid]="dataTestId" [name]="name" [checked]="_checked" [disabled]="!_enabled" [value]="_value" (change)="onChange.emit($event)">
  @if (icon && iconPosition==='before') {
    <mat-icon>{{ icon }}</mat-icon>
  }
  {{ label | oTranslate }}
  @if (icon && iconPosition==='after') {
    <mat-icon>{{ icon }}</mat-icon>
  }
</mat-button-toggle>
