<div class="o-card-menu-item-content" (click)="onClick()" fxLayout="column" fxFill fxLayoutAlign="space-between center">

  @if (showSecondaryContainer) {
    <div class="o-card-menu-item-secondary" fxFlex="50" [fxLayout]="secondaryContainerLayout"
      fxLayoutAlign="space-around center">
      <ng-content select=".secondary-container"></ng-content>
      @if (detailComponent) {
        <ng-container #menuCardContent>
        </ng-container>
      }
    </div>
  }

  <div class="o-card-menu-item-main" fxFlex="{{ showSecondaryContainer ? '45' : '80' }}" [fxLayout]="mainContainerLayout"
    fxLayoutAlign="space-between center">
    @if (useImage() || useIcon()) {
      <div fxFlex="80" fxLayout="column" fxLayoutAlign="center center" class="o-card-menu-item-image-container">
        @if (useImage()) {
          <img [src]="image" alt="card image"/>
        }
        @if (useIcon()) {
          <mat-icon class="o-card-menu-item-icon" fxLayoutAlign="center center">{{ icon }}</mat-icon>
        }
      </div>
    }

    @if (title !== undefined) {
      <div class="o-card-menu-item-title" fxFlex="20" fxLayout="column" fxLayoutAlign="center center">{{
      title | oTranslate }}</div>
    }

    @if (tooltip) {
      <mat-icon class="o-card-menu-item-info" matTooltip="{{ tooltip | oTranslate }}" svgIcon="ontimize:info_outline"></mat-icon>
    }

    <ng-content select=".main-container"></ng-content>

    @if (buttonText !== undefined) {
      <button type="button" [disabled]="disabledButton" (click)="onButtonClick()" mat-button>
      {{ buttonText | oTranslate }}</button>
    }
  </div>


</div>
