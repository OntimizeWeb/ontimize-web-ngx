<div class="o-card-menu-item-content o-flex-column o-flex-fill o-layout-align-sb-center" (click)="onClick()">

  @if (showSecondaryContainer) {
    <div class="o-card-menu-item-secondary o-flex-50 o-layout-align-sa-center" [ngClass]="secondaryContainerLayout === 'row' ? 'o-flex-row' : 'o-flex-column'">
      <ng-content select=".secondary-container"></ng-content>
      @if (detailComponent) {
        <ng-container #menuCardContent>
        </ng-container>
      }
    </div>
  }

  <div class="o-card-menu-item-main o-layout-align-sb-center" [ngClass]="[showSecondaryContainer ? 'o-flex-45' : 'o-flex-80', mainContainerLayout === 'row' ? 'o-flex-row' : 'o-flex-column']">
    @if (useImage() || useIcon()) {
      <div class="o-flex-80 o-flex-column o-layout-align-center-center o-card-menu-item-image-container">
        @if (useImage()) {
          <img [src]="image" alt="card image"/>
        }
        @if (useIcon()) {
          <mat-icon class="o-card-menu-item-icon o-layout-align-center-center">{{ icon }}</mat-icon>
        }
      </div>
    }

    @if (title !== undefined) {
      <div class="o-card-menu-item-title o-flex-20 o-flex-column o-layout-align-center-center">{{
      title | oTranslate }}</div>
    }

    @if (tooltip) {
      <mat-icon class="o-card-menu-item-info" matTooltip="{{ tooltip | oTranslate }}">info</mat-icon>
    }

    <ng-content select=".main-container"></ng-content>

    @if (buttonText !== undefined) {
      <button type="button" [disabled]="disabledButton" (click)="onButtonClick()" mat-button>
      {{ buttonText | oTranslate }}</button>
    }
  </div>


</div>
