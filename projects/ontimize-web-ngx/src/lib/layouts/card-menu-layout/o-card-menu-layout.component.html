<div class="scrolling o-flex-row-wrap o-layout-align-sa-center o-gap-8">
  @for (item of cardItems; track item) {
    @if (item['show-in-card-menu'] !== false) {
      <o-card-menu-item button-text="CARD_MENU_LAYOUT.BUTTON_TEXT" [route]="$any(item).route" [title]="item.name"
        [tooltip]="item.tooltip" [icon]="item.icon" [image]="$any(item).image" [detail-component]="$any(item).component"
        [detail-component-inputs]="$any(item)['component-inputs']" [ngClass]="item.class">
      </o-card-menu-item>
    }
  }
  <ng-content select="o-card-menu-item"></ng-content>
</div>
