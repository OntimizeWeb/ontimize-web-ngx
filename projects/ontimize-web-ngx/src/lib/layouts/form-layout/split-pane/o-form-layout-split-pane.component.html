
<div class="o-split-pane-row-wrapper o-flex-row">
  <div #mainWrapper class="o-split-pane-main-content o-flex o-flex-row">
    <ng-content></ng-content>
  </div>

  <div #detailWrapper class="o-split-pane-content-wrapper mwlResizable" mwlResizable [enableGhostResize]="true"
    (resizeEnd)="onResizeEnd('width', $event, detailWrapper)">

    <div class="o-split-pane-resize-handle" mwlResizeHandle [resizeEdges]="{ left: true }">
      <div class="o-split-pane-resize-border">
        <div></div>
      </div>
    </div>

    <div class="o-split-pane-secondary-content o-flex-column o-layout-align-center-stretch o-flex">
      <ng-template o-form-layout-manager-content></ng-template>
    </div>
  </div>
</div>
@if (showLoading | async) {
  <div class="spinner-container o-flex-column o-layout-align-center-center">
    <mat-progress-spinner mode="indeterminate" strokeWidth="3"></mat-progress-spinner>
  </div>
}
