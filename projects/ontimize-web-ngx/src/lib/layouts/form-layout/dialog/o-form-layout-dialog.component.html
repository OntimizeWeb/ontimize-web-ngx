<div fxLayout="row" fxLayoutAlign="space-between center" class="title-container" mat-dialog-title>
  <span fxFlex fxLayoutAlign="center center"> {{ title | oTranslate }} @if (title?.length>0) {
    <span>{{dialogTitleSeparator}}&nbsp;</span>
    }{{ label
  }}</span>
  @if (showFullscreenButton) {
    <mat-icon aria-label="fullscreen dialog" (click)="setFullscreenDialog()" (keydown)="setFullscreenDialog()">
      @if (fullscreen) {
        fullscreen_exit
      }
      @if (!fullscreen) {
        fullscreen
      }
    </mat-icon>
  }
  <mat-icon (click)="closeDialog()" svgIcon="ontimize:close"></mat-icon>
</div>

<div mat-dialog-content class="form-layout-dialog-container">
  <ng-template o-form-layout-manager-content></ng-template>
</div>
