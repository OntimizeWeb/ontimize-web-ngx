<div class="title-container o-flex-row o-layout-align-sb-center" mat-dialog-title>
  <span class="o-flex o-layout-align-center-center"> {{ title | oTranslate }} @if (title?.length>0) {
    <span>{{dialogTitleSeparator}}&nbsp;</span>
    }{{ label
  }}</span>
  @if (showFullscreenButton) {
    <mat-icon aria-label="fullscreen dialog" data-testid="form-dialog-fullscreen" (click)="setFullscreenDialog()" (keydown)="setFullscreenDialog()">
      @if (fullscreen) {
        fullscreen_exit
      }
      @if (!fullscreen) {
        fullscreen
      }
    </mat-icon>
  }
  <mat-icon data-testid="form-dialog-close" (click)="closeDialog()">close</mat-icon>
</div>

<div mat-dialog-content class="form-layout-dialog-container">
  <ng-template o-form-layout-manager-content></ng-template>
</div>
