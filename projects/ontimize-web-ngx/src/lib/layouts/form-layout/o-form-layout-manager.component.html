
@switch (mode) {
  @case (OFormLayoutManagerComponent.TAB_MODE) {
    <o-form-layout-tabgroup #tabGroup [title]="title" (onMainTabSelected)="onMainTabSelected.emit($event)"
      (onSelectedTabChange)="onSelectedTabChange.emit($event)" (onCloseTab)="onCloseTab.emit($event)" [options]="tabGroupOptions"
      [stretch-tabs]="stretchTabs">
      <ng-content *ngTemplateOutlet="contentBlock"></ng-content>
    </o-form-layout-tabgroup>
  }
  @case (OFormLayoutManagerComponent.SPLIT_PANE_MODE) {
    <o-form-layout-split-pane #splitPane [options]="splitPaneOptions">
      <ng-content *ngTemplateOutlet="contentBlock"></ng-content>
    </o-form-layout-split-pane>
  }
  @case (OFormLayoutManagerComponent.DIALOG_MODE) {
    <ng-content *ngTemplateOutlet="contentBlock"></ng-content>
  }
  @case (OFormLayoutManagerComponent.SIDENAV_MODE) {
    <o-form-layout-sidenav #sidenav [position]="sidenavOptions.position || sidenavPosition" [width]="sidenavOptions.width || sidenavWidth">
      <ng-content *ngTemplateOutlet="contentBlock"></ng-content>
    </o-form-layout-sidenav>
  }
}


<ng-template #contentBlock>
  <ng-content></ng-content>
</ng-template>
