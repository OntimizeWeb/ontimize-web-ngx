name: Sonar
on:
  push:
    branches:
      - main.18.x
      - 18.x.x
      - hotfix/18.*
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 'Cache node modules'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.V18_NODE_VERSION }}

      - name: npm install and npm run test-ci
        run: |
          npm i
          npm run test-ci

      - name: coverage .lcov workaround
        run: |
          sed -i 's+/home/runner/work/ontimize-web-ngx/ontimize-web-ngx+/github/workspace+g' coverage/ontimize-web-ngx/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}