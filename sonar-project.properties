sonar.projectKey=OntimizeWeb_ontimize-web-ngx
sonar.organization=ontimizeweb

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=ontimize-web-ngx
sonar.sourceEncoding=UTF-8

sonar.sources=projects/ontimize-web-ngx/src/lib
sonar.tests=projects/ontimize-web-ngx/src/lib
sonar.exclusions=**/node_modules/**
sonar.test.inclusions=**/*.spec.ts
sonar.typescript.lcov.reportPaths=coverage/ontimize-web-ngx/lcov.info
sonar.testExecutionReportPaths=reports/ut_report.xml

sonar.issue.ignore.multicriteria=e1,e2,e3
# Nesting selectors should have a scoping root: in SCSS the `&` inside a @mixin is scoped by the caller's @include
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.scss
# <li> without <ul>: the <ul> lives in the parent template, which Sonar does not see when analyzing this one
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=**/o-app-sidenav-menu-item.component.html
# Deprecated moment.js API: provideODateAdapter('moment') is the compatibility bridge that has to use it
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e3.resourceKey=**/o-date-adapter.provider.ts